name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,paper]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit tests
        run: python -m pytest
      - name: Claim contract
        run: python scripts/check_claim_contract.py
      - name: Normalized evidence
        run: python scripts/verify_evidence.py
      - name: Paper package
        run: python -m scripts.verify_paper
